<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LumenPnP Copilot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Ubuntu+Mono&display=swap">
<style>
/* Layout: an Ubuntu (GNOME/Yaru) window on the aubergine desktop. Sidebar: app name, machine
   status rows, the collapsible parts list, the job. Content: header bar with the part search, then
   three cards: camera over board, task timeline, Claude chat. Ubuntu orange marks what a person
   decides or what is current; green marks what the machine or Claude has done. Follows the system
   light/dark setting like Yaru does. */
:root {
  color-scheme: light;
  --desk-1: #2c001e;
  --desk-2: #77216f;
  --window: #ffffff;
  --side: #f6f5f4;
  --card: #ffffff;
  --card-2: #f6f5f4;
  --field: #ebebeb;
  --hover: rgba(0,0,0,.06);
  --active: rgba(0,0,0,.1);
  --line: rgba(0,0,0,.1);
  --fg: #3d3d3d;
  --muted: #77767b;
  --faint: #9a9996;
  --accent: #e95420;
  --accent-fg: #ffffff;
  --accent-soft: rgba(233,84,32,.12);
  --done: #26a269;
  --done-soft: rgba(38,162,105,.12);
  --fail: #c01c28;
  --fail-soft: rgba(192,28,40,.1);
  --warn: #c88800;
  --warn-soft: rgba(229,165,10,.16);
  --info: #3584e4;
  --pad-todo: #8b9a92;
  --font-ui: "Ubuntu", "Noto Sans TC", "Microsoft JhengHei UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
  --font-num: "Ubuntu Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --window: #2c2c2c;
    --side: #303030;
    --card: #383838;
    --card-2: #303030;
    --field: #444444;
    --hover: rgba(255,255,255,.07);
    --active: rgba(255,255,255,.12);
    --line: rgba(255,255,255,.1);
    --fg: #f7f7f7;
    --muted: #b8b8b8;
    --faint: #8f8f8f;
    --accent-soft: rgba(233,84,32,.22);
    --done: #57e389;
    --done-soft: rgba(87,227,137,.14);
    --fail: #ff7b63;
    --fail-soft: rgba(255,123,99,.14);
    --warn: #f8e45c;
    --warn-soft: rgba(248,228,92,.14);
    --pad-todo: #7d8a83;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--fg); font: 14px/1.5 var(--font-ui); overflow: hidden;
  background: radial-gradient(ellipse 80% 70% at 85% 110%, #e95420 0%, rgba(233,84,32,0) 55%),
              linear-gradient(135deg, var(--desk-1) 0%, #5e2750 55%, var(--desk-2) 100%);
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible, [role="button"]:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
.mono { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
@keyframes blink { 50% { opacity: .3; } }
@keyframes spin { to { transform: rotate(360deg); } }

/* the window */
#app {
  position: fixed; inset: 14px; display: grid; grid-template-columns: 268px 1fr;
  background: var(--window); border-radius: 12px; overflow: hidden;
  box-shadow: 0 0 0 1px rgba(0,0,0,.25), 0 16px 48px rgba(0,0,0,.45);
}

/* sidebar */
#side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.side-title { height: 52px; display: grid; place-items: center; font-weight: 500; font-size: 15px; flex: 0 0 auto; }
.side-list { display: flex; flex-direction: column; gap: 2px; padding: 4px 10px 8px; }
.chip {
  display: flex; align-items: center; gap: 12px; padding: 7px 12px; border-radius: 8px; font-size: 14px;
  color: var(--fg); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chip i { flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%; background: var(--faint); margin: 0 4px; }
.chip.on i { background: var(--done); }
.chip.bad { color: var(--fail); }
.chip.bad i { background: var(--fail); }
.chip.busy i { background: var(--warn); animation: blink 1s infinite; }
#cMachine { font-weight: 500; background: var(--active); }
#cMachine::before { content: ""; width: 17px; height: 17px; flex: 0 0 auto; border-radius: 4px; background: var(--accent); }
#cMachine.sim::before { background: var(--warn); }
#cMachine.bad::before { background: var(--fail); }
.chip.part { color: var(--done); }
.chip.part::before, #cNozzles .chip:not(.part)::before {
  content: ""; width: 9px; height: 9px; border-radius: 50%; margin: 0 4px; flex: 0 0 auto;
  border: 2px solid currentColor; box-sizing: border-box;
}
#cNozzles .chip:not(.part) { color: var(--muted); }
.side-foot { border-top: 1px solid var(--line); padding: 10px 14px; flex: 0 0 auto; margin-top: auto; }
.job { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* content */
#main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.headerbar { height: 52px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; padding: 0 12px; }
.search {
  display: flex; align-items: center; gap: 8px; width: min(420px, 100%); height: 34px; padding: 0 10px;
  background: var(--field); border-radius: 8px; color: var(--muted);
}
.search:focus-within { box-shadow: 0 0 0 2px var(--accent); }
.search svg { width: 16px; height: 16px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 2; }
.search input { flex: 1; min-width: 0; border: 0; background: none; color: var(--fg); font: inherit; font-size: 14px; outline: none; }
main {
  flex: 1; min-height: 0; display: grid; gap: 12px; padding: 0 14px 14px;
  grid-template-columns: minmax(400px, 1.25fr) minmax(280px, .75fr) minmax(340px, 1fr);
  grid-template-rows: minmax(0, 1fr);
}
.col { min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.panel {
  background: var(--card); border-radius: 12px; min-height: 0; display: flex; flex-direction: column;
  box-shadow: 0 0 0 1px var(--line), 0 1px 3px rgba(0,0,0,.06);
}
.ph { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 8px 12px; min-height: 44px; }
.ph h2 { margin: 0; font-size: 14px; font-weight: 700; white-space: nowrap; }
.ph .sub { color: var(--muted); font-size: 12px; }
.ph .grow { flex: 1; }
.tabs { display: flex; gap: 2px; background: var(--field); border-radius: 8px; padding: 2px; }
.tabs button { border: 0; background: none; padding: 2px 11px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--muted); }
.tabs button:hover { color: var(--fg); }
.tabs button[aria-pressed="true"] { background: var(--card); color: var(--fg); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.btn { border: 0; background: var(--hover); border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 13px; font-weight: 500; }
.btn:hover { background: var(--active); }
.btn.primary { background: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.human { background: var(--accent); color: var(--accent-fg); }
.btn.danger { color: var(--fail); }
.btn:disabled { opacity: .45; cursor: default; }

/* camera */
#cameraPanel { flex: 0 0 auto; }
.cams { display: grid; gap: 8px; padding: 0 10px 10px; grid-template-columns: 1fr; justify-items: center; }
.cams .cam { width: 100%; }
.cams.both { grid-template-columns: 1fr 1fr; }
.cam { position: relative; background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 4 / 3; max-height: 37vh; }
.cams.both .cam { max-height: 25vh; }
.cam img { width: 100%; height: 100%; object-fit: contain; display: block; }
.cam img:not([src]) { visibility: hidden; }
#boardPanel .ph { flex-wrap: nowrap; }
#boardTabs { flex: 0 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
#boardTabs button { flex: 0 0 auto; }
.cam .label { position: absolute; left: 8px; top: 8px; font-size: 12px; color: #fff; background: rgba(0,0,0,.55); padding: 1px 8px; border-radius: 6px; }
.cam .cross { position: absolute; inset: 0; pointer-events: none; }
.cam .cross::before, .cam .cross::after { content: ""; position: absolute; background: rgba(233,84,32,.55); }
.cam .cross::before { left: 50%; top: 0; bottom: 0; width: 1px; }
.cam .cross::after { top: 50%; left: 0; right: 0; height: 1px; }
.cam .msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; color: #b8b8b8; font-size: 13px; }

/* board */
#boardPanel { flex: 1 1 auto; }
#boardWrap { position: relative; flex: 1; min-height: 160px; margin: 0 10px 10px; border-radius: 8px; background: var(--card-2); overflow: hidden; }
#board { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
#board.dragging { cursor: grabbing; }
#board .pl { cursor: pointer; }
#board .pad { fill: #3a4650; }
#board .pl.placed .pad { fill: #57e389; }
#board .pl.todo .pad { fill: var(--pad-todo); }
#board .pl.disabled { opacity: .3; }
#board .pl.sel .pad { fill: var(--accent); }
#board .pl.now .pad { fill: var(--accent); animation: blink 1s infinite; }
#board .body { fill: none; stroke: #9fb2a8; stroke-width: .06; stroke-dasharray: .25 .18; }
#board .pl.sel .body { stroke: var(--accent); stroke-width: .12; stroke-dasharray: none; }
#board .lbl { font: .7px var(--font-num); fill: #c9d6cf; text-anchor: middle; pointer-events: none; }
#board .fid { fill: none; stroke: #f8e45c; stroke-width: .12; }
#boardTip {
  position: absolute; pointer-events: none; background: #303030; color: #f7f7f7; border-radius: 8px;
  padding: 5px 9px; font-size: 12px; white-space: nowrap; display: none; z-index: 5; box-shadow: 0 2px 8px rgba(0,0,0,.3);
}
#boardTip span { color: #b8b8b8 !important; }
.legend { display: flex; gap: 10px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--c); }

#taskPanel { flex: 1 1 auto; }
/* timeline: phases holding tasks; only the current phase is open */
#lyrics {
  position: relative; flex: 1; min-height: 0; overflow-y: auto; padding: 0 12px; margin: 0; list-style: none;
  -webkit-mask-image: linear-gradient(transparent, #000 16%, #000 84%, transparent);
          mask-image: linear-gradient(transparent, #000 16%, #000 84%, transparent);
}
#lyrics.all { -webkit-mask-image: none; mask-image: none; }
/* Room above and below, so any row can scroll level with the camera's middle. Spacers rather
   than padding, because padding would make the list taller than its panel. */
#lyrics::before, #lyrics::after { content: ""; display: block; height: 60vh; }
#lyrics::after { height: 100vh; }
#lyrics .phase { position: relative; padding-left: 22px; transition: opacity .3s; }
#lyrics .phase::before {
  content: ""; position: absolute; left: 5px; top: 14px; width: 10px; height: 10px; border-radius: 50%;
  border: 2px solid var(--faint); box-sizing: border-box; background: var(--card);
}
#lyrics .phase::after { content: ""; position: absolute; left: 9px; top: 26px; bottom: -4px; width: 2px; background: var(--line); }
#lyrics .phase:last-child::after { display: none; }
#lyrics .phase.past::before { background: var(--done); border-color: var(--done); }
#lyrics .phase.next::before { border-style: dotted; }
#lyrics .ph-head {
  display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left; border: 0; background: none;
  padding: 8px 8px; border-radius: 8px; cursor: pointer; color: var(--muted); font-size: 14px;
}
#lyrics .ph-head:hover { background: var(--hover); }
#lyrics .ph-name { font-weight: 500; color: var(--fg); }
#lyrics .ph-sum { font-size: 12px; color: var(--faint); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#lyrics .ph-head.has-fail .ph-sum { color: var(--fail); }
#lyrics .ph-time { font-size: 12px; color: var(--faint); }
#lyrics .phase.current::before { width: 14px; height: 14px; left: 3px; top: 13px; background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft); }
#lyrics .phase.current > .ph-head { cursor: default; background: var(--accent-soft); padding-block: 10px; }
#lyrics .phase.current > .ph-head:hover { background: var(--accent-soft); }
#lyrics .phase.current .ph-name { font-size: 20px; font-weight: 700; color: var(--accent); }
#lyrics .phase.idle .ph-head { cursor: default; font-style: italic; color: var(--faint); }
#lyrics .phase.idle::before { background: none; border-color: var(--faint); }
#lyrics:not(.all) .phase[data-d="1"] { opacity: .85; }
#lyrics:not(.all) .phase[data-d="2"] { opacity: .65; }
#lyrics:not(.all) .phase[data-d="3"] { opacity: .5; }
#lyrics:not(.all) .phase[data-d="far"] { opacity: .35; }
#lyrics .tasks { list-style: none; margin: 2px 0 8px; padding: 0 0 0 4px; }
#lyrics .task { border-radius: 6px; }
#lyrics .task-row { display: flex; align-items: center; gap: 8px; padding: 3px 8px; border-radius: 6px; min-height: 28px; }
#lyrics .task-row:hover, #lyrics .task.open .task-row { background: var(--hover); }
#lyrics .task-row::before { content: ""; flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--faint); box-sizing: border-box; }
#lyrics .task.done .task-row::before { background: var(--done); border-color: var(--done); }
#lyrics .task.fail .task-row::before { background: var(--fail); border-color: var(--fail); }
#lyrics .task.next .task-row::before { border-style: dotted; }
#lyrics .task.now .task-row::before { width: 9px; height: 9px; background: var(--accent); border-color: var(--accent); animation: blink 1.2s infinite; }
#lyrics .task-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--muted); }
#lyrics .task.now .task-text { color: var(--fg); font-weight: 700; font-size: 15px; }
#lyrics .task.fail .task-text { color: var(--fail); }
#lyrics .task-time { font-size: 11px; color: var(--faint); }
#lyrics .det {
  border: 0; background: var(--active); color: var(--fg); border-radius: 6px; padding: 0 8px; font-size: 12px;
  line-height: 20px; cursor: pointer; visibility: hidden;
}
#lyrics .task-row:hover .det, #lyrics .det:focus-visible, #lyrics .task.open .det { visibility: visible; }
@media (hover: none) { #lyrics .det { visibility: visible; } }
#lyrics .task-detail {
  margin: 2px 8px 6px 23px; padding: 6px 10px; background: var(--card-2); border-radius: 6px;
  display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px;
}
#lyrics .task-detail dt { color: var(--faint); }
#lyrics .task-detail dd { margin: 0; color: var(--fg); white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
#lyrics .task-detail dd.mono { font-size: 11.5px; max-height: 160px; overflow-y: auto; }
#lyrics .more { font-size: 12px; color: var(--faint); padding: 2px 8px 2px 23px; }

/* jog panel, in the sidebar */
#jog { margin: 0 10px 8px; padding: 8px 4px 6px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; outline: none; }
#jog:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); border-radius: 8px; }
.jog-head { display: flex; align-items: center; gap: 8px; padding: 0 8px; }
.jog-head h2 { margin: 0; font-size: 14px; font-weight: 400; flex: 1; }
.jog-pos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 0 8px; font-size: 12px; color: var(--muted); }
.jog-pos b { color: var(--faint); font-weight: 500; margin-right: 3px; }
.jog-body { display: flex; justify-content: center; align-items: center; gap: 14px; }
.jog-pad { display: grid; grid-template-columns: repeat(3, 38px); grid-template-rows: repeat(3, 38px); gap: 4px; }
.jog-side { display: grid; grid-template-columns: 38px 38px; grid-template-rows: repeat(2, 38px); gap: 4px; }
.jog-btn {
  border: 0; border-radius: 8px; background: var(--hover); color: var(--fg); cursor: pointer; font-size: 16px;
  display: grid; place-items: center; padding: 0; line-height: 1;
}
.jog-btn:hover { background: var(--active); }
.jog-btn:active { background: var(--accent); color: var(--accent-fg); }
.jog-btn:disabled { opacity: .35; cursor: default; background: var(--hover); color: var(--fg); }
.jog-btn.safe { font-size: 11px; font-weight: 700; color: var(--accent); }
.jog-btn small { font-size: 9px; color: var(--muted); display: block; }
.jog-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 8px; font-size: 12px; color: var(--muted); }
#jogMsg { min-height: 1.2em; padding: 0 8px; font-size: 12px; color: var(--fail); }
#jog.locked .jog-pad, #jog.locked .jog-side { filter: grayscale(1); }

/* vision overlay on the live view */
.cam .ovl { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.cam .ovl .fresh { animation: ovIn .5s ease-out; }
@keyframes ovIn { from { opacity: 0; } to { opacity: 1; } }
.cam .ov-rect { fill: none; stroke: #57e389; stroke-width: 3; vector-effect: non-scaling-stroke; }
.cam .ov-pin { fill: rgba(233,84,32,.25); stroke: #e95420; stroke-width: 3; vector-effect: non-scaling-stroke; }
.cam .ov-text { fill: #57e389; font: 700 16px var(--font-ui); paint-order: stroke; stroke: rgba(0,0,0,.7); stroke-width: 4px; }
.cam .ov-text.pin { fill: #ff8a5c; }
.cam .vbadge { position: absolute; left: 8px; bottom: 8px; font-size: 12px; color: #fff; background: rgba(38,162,105,.85); padding: 2px 9px; border-radius: 6px; }

/* parts, in the sidebar */
#partsPanel { flex: 0 1 auto; min-height: 0; display: flex; flex-direction: column; margin: 0 10px; border-top: 1px solid var(--line); padding-top: 6px; }
#partsPanel.open { flex: 1 1 auto; }
#partsHead { display: flex; align-items: center; gap: 12px; padding: 7px 12px; border-radius: 8px; cursor: pointer; user-select: none; }
#partsHead:hover { background: var(--hover); }
#partsHead h2 { margin: 0; font-size: 14px; font-weight: 400; }
#partsHead .sub { color: var(--muted); font-size: 12px; margin-left: auto; }
#partsPanel .caret { width: 17px; text-align: center; transition: transform .2s; color: var(--muted); }
#partsPanel.open .caret { transform: rotate(90deg); }
#partsBody { display: none; flex-direction: column; min-height: 0; flex: 1; }
#partsPanel.open #partsBody { display: flex; }
#parts { overflow-y: auto; padding: 2px 0 8px; flex: 1; }
.part { border-radius: 8px; }
.part > summary { list-style: none; display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: center; padding: 5px 10px; cursor: pointer; border-radius: 8px; }
.part > summary::-webkit-details-marker { display: none; }
.part > summary:hover { background: var(--hover); }
.part.sel > summary { background: var(--accent-soft); }
.part > summary::before { content: "▸"; color: var(--faint); font-size: 10px; }
.part[open] > summary::before { content: "▾"; }
.part .pid { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.part .pkg { color: var(--faint); font-size: 11px; margin-left: 6px; }
.part .count { font-size: 12px; color: var(--muted); }
.part .count.full { color: var(--done); }
.part ul { list-style: none; margin: 2px 0 6px 30px; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; }
.part li button { border: 0; background: var(--hover); border-radius: 6px; padding: 0 7px; font: 12px var(--font-num); cursor: pointer; color: var(--muted); }
.part li button:hover { background: var(--active); }
.part li button.placed { color: var(--done); background: var(--done-soft); }
.part li button.sel { color: var(--accent-fg); background: var(--accent); }

/* chat */
#chatPanel { flex: 1; }
#chatLog { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 14px 12px; display: flex; flex-direction: column; gap: 10px; }
.empty { color: var(--faint); text-align: center; margin: auto; max-width: 30ch; }
.msg-user { align-self: flex-end; max-width: 88%; background: var(--accent); color: var(--accent-fg); border-radius: 14px 14px 4px 14px; padding: 7px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg-user img { display: block; max-width: 160px; border-radius: 6px; margin-top: 6px; }
.msg-text { overflow-wrap: anywhere; }
.msg-text p { margin: 0 0 .55em; }
.msg-text p:last-child { margin-bottom: 0; }
.msg-text ul, .msg-text ol { margin: .2em 0 .6em; padding-left: 1.4em; }
.msg-text code { font: 13px var(--font-num); background: var(--hover); border-radius: 4px; padding: 0 4px; }
.msg-text pre { background: var(--card-2); border-radius: 8px; padding: 8px 10px; overflow-x: auto; margin: .3em 0 .7em; }
.msg-text pre code { padding: 0; background: none; }
.msg-text h3, .msg-text h4 { margin: .6em 0 .3em; font-size: 14px; }
.msg-text table { border-collapse: collapse; margin: .3em 0 .7em; font-size: 13px; display: block; overflow-x: auto; }
.msg-text th, .msg-text td { border: 1px solid var(--line); padding: 2px 8px; text-align: left; }
.msg-text a { color: var(--info); }
.sub-agent { margin: 0 8px 6px 14px; padding-left: 10px; border-left: 2px solid var(--line); }
details.think { color: var(--faint); font-size: 13px; }
details.think summary { cursor: pointer; }
details.think div { white-space: pre-wrap; padding: 4px 0 0 12px; }
.tool { background: var(--card-2); border-radius: 8px; font-size: 13px; }
.tool > summary { list-style: none; display: flex; gap: 8px; align-items: center; padding: 6px 10px; cursor: pointer; border-radius: 8px; }
.tool > summary:hover { background: var(--hover); }
.tool > summary::-webkit-details-marker { display: none; }
.tool .st { width: 14px; text-align: center; flex: 0 0 auto; }
.tool.running .st::before { content: "◌"; color: var(--warn); display: inline-block; animation: spin 1s linear infinite; }
.tool.ok .st::before { content: "✓"; color: var(--done); }
.tool.err .st::before { content: "✗"; color: var(--fail); }
.tool .name { font-family: var(--font-num); color: var(--fg); white-space: nowrap; font-weight: 500; }
.tool .srv { color: var(--faint); font-family: var(--font-num); }
.tool .sum { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.tool .bodyx { border-top: 1px solid var(--line); padding: 6px 10px; display: flex; flex-direction: column; gap: 6px; }
.tool pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.45 var(--font-num); color: var(--muted); max-height: 260px; overflow-y: auto; }
.tool .imgs { display: flex; flex-wrap: wrap; gap: 6px; }
.tool .imgs img, .tool-imgs img { height: 96px; border-radius: 6px; cursor: zoom-in; }
.tool-imgs { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 0 24px; }
.todo-card { background: var(--card-2); border-radius: 8px; padding: 7px 12px; font-size: 13px; }
.todo-card div { padding: 1px 0; }
.todo-card .completed { color: var(--faint); text-decoration: line-through; }
.todo-card .in_progress { color: var(--accent); font-weight: 700; }
.perm { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; box-shadow: inset 0 0 0 1px var(--accent); }
.perm .q { font-weight: 700; }
.perm pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px var(--font-num); color: var(--muted); max-height: 160px; overflow-y: auto; }
.perm .row { display: flex; gap: 8px; }
.perm.answered { background: var(--card-2); box-shadow: none; }
.perm.answered .row { display: none; }
.note { color: var(--faint); font-size: 12px; text-align: center; }
.note.err { color: var(--fail); }
.turn-end { color: var(--faint); font-size: 11px; font-family: var(--font-num); }
#composer { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
#composer textarea {
  resize: none; min-height: 60px; max-height: 200px; background: var(--field); color: var(--fg); border: 0;
  border-radius: 10px; padding: 8px 12px; font: inherit;
}
#composer textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }
#composer .row { display: flex; gap: 6px; align-items: center; }
#composer .row .grow { flex: 1; }
#attach { display: flex; gap: 6px; }
#attach img { height: 44px; border-radius: 6px; }
.switch { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
.switch input { accent-color: var(--accent); }
.switch.on { color: var(--accent); font-weight: 500; }

#lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; place-items: center; z-index: 20; cursor: zoom-out; }
#lightbox img { max-width: 94vw; max-height: 94vh; }

@media (max-width: 1280px) {
  #app { grid-template-columns: 220px 1fr; }
  main { grid-template-columns: 1fr 1fr; overflow-y: auto; }
  #taskPanel { min-height: 320px; }
  .col:last-child { grid-column: 1 / -1; }
  #chatPanel { min-height: 520px; }
}
@media (max-width: 860px) {
  body { overflow: auto; }
  #app { position: static; margin: 10px; grid-template-columns: 1fr; }
  #side { border-right: 0; border-bottom: 1px solid var(--line); }
  main { grid-template-columns: 1fr; }
  #boardWrap { min-height: 300px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

<body>
<div id="app">
  <aside id="side">
    <div class="side-title">LumenPnP Copilot</div>
    <div class="side-list" aria-label="Machine status">
      <span class="chip" id="cMachine">Connecting…</span>
      <span class="chip" id="cEnabled"><i></i>Enabled</span>
      <span class="chip" id="cHomed"><i></i>Homed</span>
      <span class="chip" id="cBusy"><i></i>Idle</span>
      <span id="cNozzles" style="display:contents"></span>
    </div>
    <section id="jog" tabindex="0" aria-label="Jog">
      <div class="jog-head"><h2>Jog</h2><div class="tabs" id="jogTool" role="group" aria-label="Tool to move"></div></div>
      <div class="jog-pos mono" id="jogPos"></div>
      <div class="jog-body">
        <div class="jog-pad">
          <span></span><button class="jog-btn" type="button" data-move="yp" title="Y+ (Up arrow)">▲</button><span></span>
          <button class="jog-btn" type="button" data-move="xm" title="X− (Left arrow)">◀</button><button class="jog-btn safe" type="button" data-move="safe" title="Lift the head to Safe Z">SAFE<br>Z</button><button class="jog-btn" type="button" data-move="xp" title="X+ (Right arrow)">▶</button>
          <span></span><button class="jog-btn" type="button" data-move="ym" title="Y− (Down arrow)">▼</button><span></span>
        </div>
        <div class="jog-side">
          <button class="jog-btn" type="button" data-move="zp" title="Z+ (Page Up)">Z<small>▲</small></button><button class="jog-btn" type="button" data-move="cp" title="Rotate + (])">⟲</button>
          <button class="jog-btn" type="button" data-move="zm" title="Z− (Page Down)">Z<small>▼</small></button><button class="jog-btn" type="button" data-move="cm" title="Rotate − ([)">⟳</button>
        </div>
      </div>
      <div class="jog-foot"><span>Step, mm</span><div class="tabs" id="jogStep" role="group" aria-label="Step"></div></div>
      <div id="jogMsg"></div>
    </section>
    <div id="partsPanel">
      <div id="partsHead" role="button" tabindex="0" aria-expanded="false">
        <span class="caret">▸</span>
        <h2>Parts</h2>
        <span class="sub" id="partsSub"></span>
      </div>
      <div id="partsBody">
        <div id="parts"></div>
      </div>
    </div>
    <div class="side-foot"><span class="job mono" id="jobName"></span></div>
  </aside>

  <div id="main">
    <div class="headerbar">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
        <input id="partsFilter" type="search" placeholder="Search parts or references">
      </label>
    </div>
    <main>
      <section class="col">
        <div class="panel" id="cameraPanel">
          <div class="ph">
            <h2>Camera</h2>
            <div class="tabs" id="camTabs" role="group" aria-label="Camera"></div>
            <span class="grow"></span>
            <button class="btn" id="camPause" type="button">Pause</button>
          </div>
          <div class="cams" id="cams"></div>
        </div>
        <div class="panel" id="boardPanel">
          <div class="ph">
            <h2>Board</h2>
            <div class="tabs" id="boardTabs" role="group" aria-label="Board"></div>
            <span class="grow"></span>
            <div class="legend"><span style="--c:#57e389">Placed</span><span style="--c:var(--pad-todo)">To place</span><span style="--c:var(--accent)">Selected</span></div>
            <button class="btn" id="boardFit" type="button" title="Reset zoom">⤢</button>
          </div>
          <div id="boardWrap">
            <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
            <div id="boardTip"></div>
          </div>
        </div>
      </section>

      <section class="col">
        <div class="panel" id="taskPanel">
          <div class="ph">
            <h2>Tasks</h2>
            <span class="sub" id="taskSub"></span>
            <span class="grow"></span>
            <button class="btn" id="lyricsMode" type="button">Expand all</button>
          </div>
          <ol id="lyrics"></ol>
        </div>
      </section>

      <section class="col">
        <div class="panel" id="chatPanel">
          <div class="ph">
            <h2>Claude</h2>
            <span class="sub" id="chatSub"></span>
            <span class="grow"></span>
            <label class="switch" id="autoWrap" title="When on, tools that need permission run without asking"><input type="checkbox" id="autoApprove">Auto-approve</label>
            <button class="btn" id="newChat" type="button">New chat</button>
          </div>
          <div id="chatLog"><div class="empty" id="chatEmpty">Tell Claude what to do. Tools that need permission will ask you here.</div></div>
          <div id="composer">
            <div id="attach"></div>
            <textarea id="input" placeholder="For example: scan the QR feeders, then place the 0603s on Brd2 (Enter to send, Shift+Enter for a new line)"></textarea>
            <div class="row">
              <button class="btn" id="attachCam" type="button">Attach camera image</button>
              <span class="grow"></span>
              <button class="btn danger" id="stop" type="button" hidden>Stop</button>
              <button class="btn primary" id="send" type="button">Send</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>
<div id="lightbox"><img alt=""></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var SVGNS = 'http://www.w3.org/2000/svg';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function svg(tag, attrs, parent) {
    var e = document.createElementNS(SVGNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function getJSON(url) {
    return fetch(url, { cache: 'no-store' }).then(function (r) {
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; });
    });
  }
  function postJSON(url, body) {
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) })
      .then(function (r) { return r.json(); });
  }
  function hhmm(t) {
    var d = new Date(t);
    return isNaN(d) ? '' : String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  var state = {
    status: null, layout: null, actions: [], todos: null, running: {}, board: null,
    selPart: null, selPlacement: null, sim: false
  };

  // ------------------------------------------------------------------ status header
  function chip(id, on, text, cls) {
    var c = $(id);
    c.className = 'chip' + (cls ? ' ' + cls : on ? ' on' : '');
    c.innerHTML = '<i></i>' + esc(text);
  }
  function pollStatus() {
    getJSON('/api/view/status').then(function (s) {
      state.status = s;
      $('cMachine').className = 'chip ' + (state.sim ? 'sim' : 'real');
      $('cMachine').textContent = state.sim ? 'Simulator' : 'Real machine';
      chip('cEnabled', s.enabled, s.enabled ? 'Enabled' : 'Not enabled', s.enabled ? '' : 'bad');
      chip('cHomed', s.homed, s.homed ? 'Homed' : 'Not homed', s.homed ? '' : 'bad');
      chip('cBusy', false, s.jobActive ? 'Job running' : s.busy ? 'Moving' : 'Idle', s.busy || s.jobActive ? 'busy' : '');
      var nz = $('cNozzles'); nz.innerHTML = '';
      (s.nozzles || []).forEach(function (n) {
        var c = el('span', 'chip' + (n.partOnNozzle ? ' part' : ''));
        c.textContent = n.name + ': ' + (n.partOnNozzle || 'empty') + (n.atSafeZ === false ? ' (below safe Z)' : '');
        c.title = (n.nozzleTip || '') + ' Z ' + n.z;
        nz.appendChild(c);
      });
      renderJog();
      drawOverlays();
      renderTimeline();
      realignTimeline();
    }).catch(function (e) {
      $('cMachine').className = 'chip bad';
      $('cMachine').textContent = 'OpenPnP not reachable';
      $('cMachine').title = e.message;
    });
  }

  // ------------------------------------------------------------------ cameras
  // ?poll=1: fetch single frames instead of the MJPEG stream.
  var POLL_FRAMES = /[?&]poll=1/.test(location.search);
  var cams = [], camMode = null, camPaused = false, camGeneration = 0;
  function camUrl(name) { return '/api/view/camera/stream?fps=8&camera=' + encodeURIComponent(name) + '&t=' + Date.now(); }
  function pollFrames(img, name, gen) {
    // Fallback when the MJPEG stream shows nothing: fetch single frames, about 4 per second.
    if (gen !== camGeneration || camPaused) return;
    var next = new Image();
    next.onload = function () { img.src = next.src; setTimeout(function () { pollFrames(img, name, gen); }, 250); };
    next.onerror = function () { setTimeout(function () { pollFrames(img, name, gen); }, 2000); };
    next.src = '/api/view/camera/frame?camera=' + encodeURIComponent(name) + '&t=' + Date.now();
  }
  function renderCams() {
    var box = $('cams'); box.innerHTML = '';
    var gen = ++camGeneration;
    var list = camMode === '__both' ? cams : cams.filter(function (c) { return c.name === camMode; });
    box.className = 'cams' + (list.length > 1 ? ' both' : '');
    list.forEach(function (c) {
      var d = el('div', 'cam');
      var img = el('img'); img.alt = c.name + ' camera';
      var msg = el('div', 'msg', 'Waiting for the image…');
      var shown = false;
      img.onload = function () { shown = true; msg.hidden = true; };
      img.onerror = function () { if (!shown) { msg.hidden = false; msg.textContent = 'No image from ' + c.name + '. The live view needs OpenPnP built from this branch.'; } };
      if (!camPaused && POLL_FRAMES) {
        pollFrames(img, c.name, gen);
      }
      else if (!camPaused) {
        img.src = camUrl(c.name);
        setTimeout(function () {
          if (!shown && gen === camGeneration) { img.removeAttribute('src'); pollFrames(img, c.name, gen); }
        }, 4000);
      }
      else msg.textContent = 'Paused';
      d.appendChild(img); d.appendChild(el('div', 'cross')); d.appendChild(el('span', 'label', c.name)); d.appendChild(msg);
      var ov = svg('svg', { 'class': 'ovl', preserveAspectRatio: 'xMidYMid meet' }, d);
      ov.dataset.camera = c.name;
      var vb = el('span', 'vbadge'); vb.hidden = true; d.appendChild(vb);
      box.appendChild(d);
    });
    drawOverlays();
  }
  function renderCamTabs() {
    var t = $('camTabs'); t.innerHTML = '';
    var opts = cams.map(function (c) { return [c.name, c.name]; });
    if (cams.length > 1) opts.push(['__both', 'Both']);
    opts.forEach(function (o) {
      var b = el('button', null, o[1]); b.type = 'button';
      b.setAttribute('aria-pressed', String(camMode === o[0]));
      b.onclick = function () { camMode = o[0]; renderCamTabs(); renderCams(); };
      t.appendChild(b);
    });
  }
  function loadCameras() {
    getJSON('/api/view/cameras').then(function (j) {
      cams = j.cameras;
      if (!camMode) camMode = (cams.find(function (c) { return c.looking === 'Down'; }) || cams[0] || {}).name;
      renderCamTabs(); renderCams();
    }).catch(function () {
      $('cams').innerHTML = '<div class="cam"><div class="msg">Can\'t reach the OpenPnP view server. Start OpenPnP built from this branch, with -DaiBridge.port.</div></div>';
      setTimeout(loadCameras, 5000);
    });
  }
  $('camPause').onclick = function () {
    camPaused = !camPaused;
    this.textContent = camPaused ? 'Resume' : 'Pause';
    renderCams();
  };
  document.addEventListener('visibilitychange', function () {
    // Stop the streams while the tab is hidden, they cost the camera thread nothing but use the network.
    if (document.hidden) { $('cams').querySelectorAll('img').forEach(function (i) { i.removeAttribute('src'); }); }
    else renderCams();
  });

  // ------------------------------------------------------------------ board
  var view = null; // {x, y, w, h} viewBox
  var layoutKey = '';
  function pollLayout() {
    getJSON('/api/layout').then(function (j) {
      var key = JSON.stringify(j);
      if (key === layoutKey) return;
      layoutKey = key;
      var first = !state.layout || (state.layout.file !== j.file);
      state.layout = j;
      var name = j.file ? j.file.split(/[\\/]/).pop() : j.boards.length ? '(unsaved job)' : '(no job open)';
      $('jobName').textContent = name + (j.source === 'lastAction' ? ' · last used' : '');
      $('jobName').title = (j.file || '') + (j.source === 'lastAction'
        ? '\nNo job is open in the OpenPnP Job tab; this is the job file the bridge used last. Placed status comes from the file.' : '');
      if (!state.board || !j.boards.some(function (b) { return b.boardId === state.board; })) {
        state.board = j.boards.length ? (j.boards.find(function (b) { return b.enabled; }) || j.boards[0]).boardId : null;
        first = true;
      }
      renderBoardTabs(); renderBoard(first); renderParts(); renderTimeline();
    }).catch(function () {});
  }
  function currentBoard() {
    return state.layout && state.layout.boards.find(function (b) { return b.boardId === state.board; });
  }
  function shortId(id) { return String(id).split('⇒').pop(); }
  function renderBoardTabs() {
    var t = $('boardTabs'); t.innerHTML = '';
    (state.layout ? state.layout.boards : []).forEach(function (b) {
      var btn = el('button', null, shortId(b.boardId)); btn.type = 'button';
      btn.title = b.name + (b.enabled ? '' : ' (disabled)');
      btn.setAttribute('aria-pressed', String(b.boardId === state.board));
      btn.onclick = function () { state.board = b.boardId; renderBoardTabs(); renderBoard(true); };
      t.appendChild(btn);
    });
  }
  function boardBounds(b) {
    var w = b.width, h = b.height;
    if (w > 0 && h > 0) return { x: 0, y: 0, w: w, h: h };
    var xs = [], ys = [];
    b.placements.forEach(function (p) { xs.push(p.x); ys.push(p.y); });
    if (!xs.length) return { x: 0, y: 0, w: 10, h: 10 };
    var x0 = Math.min.apply(null, xs) - 3, y0 = Math.min.apply(null, ys) - 3;
    return { x: x0, y: y0, w: Math.max.apply(null, xs) + 3 - x0, h: Math.max.apply(null, ys) + 3 - y0 };
  }
  function renderBoard(refit) {
    var s = $('board'); s.innerHTML = '';
    var b = currentBoard();
    if (!b) { return; }
    var bb = boardBounds(b);
    var top = bb.y + bb.h; // flip: board y up, svg y down
    if (refit || !view) {
      var m = Math.max(bb.w, bb.h) * 0.06;
      view = { x: bb.x - m, y: -m, w: bb.w + 2 * m, h: bb.h + 2 * m };
    }
    applyView();
    svg('rect', { x: bb.x, y: 0, width: bb.w, height: bb.h, rx: .6, fill: '#10261f', stroke: '#2b4a3f', 'stroke-width': .15 }, s);
    var fp = state.layout.footprints || {};
    var labels = svg('g', {}, null);
    b.placements.forEach(function (p) {
      if (p.side !== b.sideUp) return;
      var cx = p.x, cy = top - p.y;
      if (p.type === 'Fiducial') {
        svg('circle', { cx: cx, cy: cy, r: .75, 'class': 'fid' }, s);
        return;
      }
      var cls = 'pl ' + (!p.enabled ? 'disabled' : p.placed ? 'placed' : 'todo');
      if (state.selPart && p.partId === state.selPart) cls += ' sel';
      if (state.selPlacement && state.selPlacement === b.boardId + ' ' + p.placementId) cls += ' sel';
      if (nowPlacement && nowPlacement === b.boardId + ' ' + p.placementId) cls += ' now';
      var g = svg('g', { 'class': cls, transform: 'translate(' + cx + ',' + cy + ') scale(1,-1) rotate(' + p.rotation + ')' }, s);
      g.dataset.key = b.boardId + ' ' + p.placementId;
      var f = fp[p.packageId];
      if (f && f.pads && f.pads.length) {
        f.pads.forEach(function (pad) {
          var r = Math.min(pad.width, pad.height) / 2 * (pad.roundness || 0) / 100;
          svg('rect', { 'class': 'pad', x: pad.x - pad.width / 2, y: pad.y - pad.height / 2, width: pad.width, height: pad.height, rx: r,
            transform: 'rotate(' + (pad.rotation || 0) + ' ' + pad.x + ' ' + pad.y + ')' }, g);
        });
        if (f.bodyWidth > 0 && f.bodyHeight > 0) {
          svg('rect', { 'class': 'body', x: -f.bodyWidth / 2, y: -f.bodyHeight / 2, width: f.bodyWidth, height: f.bodyHeight }, g);
        }
      } else {
        svg('rect', { 'class': 'pad', x: -.8, y: -.4, width: 1.6, height: .8, rx: .1 }, g);
      }
      // A larger invisible hit area so small parts are easy to point at.
      svg('circle', { cx: 0, cy: 0, r: 1.2, fill: 'transparent' }, g);
      var t = svg('text', { 'class': 'lbl', x: cx, y: cy + (f && f.bodyHeight > 3 ? 0.25 : -1.1) }, labels);
      t.textContent = p.placementId;
      g._p = p;
    });
    s.appendChild(labels);
  }
  function applyView() { $('board').setAttribute('viewBox', [view.x, view.y, view.w, view.h].join(' ')); }
  (function boardInteractions() {
    var s = $('board'), tip = $('boardTip'), drag = null;
    function toSvg(e) {
      var r = s.getBoundingClientRect();
      var scale = Math.max(view.w / r.width, view.h / r.height);
      var ox = (r.width * scale - view.w) / 2, oy = (r.height * scale - view.h) / 2;
      return { x: view.x - ox + (e.clientX - r.left) * scale, y: view.y - oy + (e.clientY - r.top) * scale, scale: scale };
    }
    s.addEventListener('wheel', function (e) {
      if (!view) return;
      e.preventDefault();
      var p = toSvg(e), k = e.deltaY > 0 ? 1.15 : 1 / 1.15;
      view = { x: p.x - (p.x - view.x) * k, y: p.y - (p.y - view.y) * k, w: view.w * k, h: view.h * k };
      applyView();
    }, { passive: false });
    s.addEventListener('pointerdown', function (e) {
      if (!view) return;
      drag = { x: e.clientX, y: e.clientY, v: Object.assign({}, view), moved: false, scale: toSvg(e).scale };
      s.setPointerCapture(e.pointerId);
    });
    s.addEventListener('pointermove', function (e) {

    jog.busy = true; renderJog();
    postJSON('/api/jog', body).then(function (r) {
      if (r.status !== 'ok') { $('jogMsg').textContent = r.reason || r.error || 'Jog failed.'; jog.msgUntil = Date.now() + 5000; }
    }).catch(function () { $('jogMsg').textContent = 'Jog failed.'; jog.msgUntil = Date.now() + 5000; })
      .finally(function () { jog.busy = false; pollStatus(); });
  }
  $('jog').addEventListener('click', function (e) {
    var b = e.target.closest('.jog-btn');
    if (!b || b.disabled) return;
    var s = jog.step, c = JOG_ROT[jog.step];
    var m = { xp: { dx: s }, xm: { dx: -s }, yp: { dy: s }, ym: { dy: -s }, zp: { dz: s }, zm: { dz: -s },
              cp: { dc: c }, cm: { dc: -c }, safe: { safeZ: true } }[b.dataset.move];
    if (m) doJog(m);
  });
  // Keys work while the jog panel has focus: arrows for X/Y, Page Up/Down for Z, [ and ] to rotate.
  $('jog').addEventListener('keydown', function (e) {
    var map = { ArrowUp: 'yp', ArrowDown: 'ym', ArrowLeft: 'xm', ArrowRight: 'xp', PageUp: 'zp', PageDown: 'zm', '[': 'cm', ']': 'cp' };
    var k = map[e.key];
    if (!k) return;
    e.preventDefault();
    var b = $('jog').querySelector('[data-move="' + k + '"]');
    if (b && !b.disabled) b.click();
  });

  // ------------------------------------------------------------------ vision overlay
  // The last vision result of a camera, drawn over its live view while the camera stays put:
  // result rectangles (e.g. the IC body) in green, pin 1 circles in orange.
  function overlayFor(name) {
    var s = state.status || {}, o = (s.visionOverlays || {})[name];
    if (!o || !o.width) return null;
    var tool = (s.tools || []).find(function (t) { return t.kind === 'camera' && t.name === name; });
    var age = Date.now() - o.time;
    if (tool && o.cameraLocation && tool.location) {
      var dx = tool.location.x - o.cameraLocation.x, dy = tool.location.y - o.cameraLocation.y;
      if (Math.hypot(dx, dy) > 0.3 || age > 600000) return null;
    } else if (age > 30000) {
      return null; // a camera that is not on the head: show the result for a while
    }
    return o;
  }
  function drawOverlays() {
    document.querySelectorAll('#cams .ovl').forEach(function (ov) {
      var name = ov.dataset.camera, o = overlayFor(name);
      var key = o ? o.sequence : 0;
      var badge = ov.parentNode.querySelector('.vbadge');
      if (o) {
        var secs = Math.round((Date.now() - o.time) / 1000);
        badge.hidden = false;
        badge.textContent = 'Vision · ' + (o.label || '') + ' · ' + o.rects.length + ' found' + (o.circles.length ? ' · pin 1' : '') + ' · ' + (secs < 60 ? secs + ' s' : Math.round(secs / 60) + ' min') + ' ago';
      } else badge.hidden = true;
      if (ov.dataset.seq === String(key)) return;
      ov.dataset.seq = String(key);
      ov.innerHTML = '';
      if (!o) return;
      ov.setAttribute('viewBox', '0 0 ' + o.width + ' ' + o.height);
      var g = svg('g', { 'class': 'fresh' }, ov);
      o.rects.forEach(function (r, i) {
        var rg = svg('g', { transform: 'translate(' + r.x + ' ' + r.y + ') rotate(' + r.angle + ')' }, g);
        svg('rect', { 'class': 'ov-rect', x: -r.width / 2, y: -r.height / 2, width: r.width, height: r.height }, rg);
        svg('path', { 'class': 'ov-rect', d: 'M-8 0H8M0 -8V8' }, rg);
        var t = svg('text', { 'class': 'ov-text', x: r.x - r.width / 2, y: r.y - Math.max(r.width, r.height) / 2 - 8 }, g);
        t.textContent = o.rects.length > 1 ? 'part ' + (i + 1) : 'part';
      });
      o.circles.forEach(function (c) {
        svg('circle', { 'class': 'ov-pin', cx: c.x, cy: c.y, r: Math.max(c.diameter / 2, 6) }, g);
        var t = svg('text', { 'class': 'ov-text pin', x: c.x + Math.max(c.diameter / 2, 6) + 6, y: c.y + 5 }, g);
        t.textContent = 'pin 1';
      });
    });
  }

  // ------------------------------------------------------------------ chat
  var log = $('chatLog'), lastEvent = 0, es = null;
  var blocks = {};      // `${msgId}:${index}` -> {type, el, text, json}
  var streamed = {};    // msgId -> true when stream events arrived for it
  var tools = {};       // tool_use id -> {card, name, input}
  var perms = {};       // request_id -> card
  var currentMsg = {};  // parent key -> msgId of the message being streamed
  var stick = true;
  log.addEventListener('scroll', function () { stick = log.scrollHeight - log.scrollTop - log.clientHeight < 60; });
  function scrollDown() { if (stick) log.scrollTop = log.scrollHeight; }
  function addToLog(node, parent) {
    $('chatEmpty').hidden = true;
    if (parent) {
      var tc = tools[parent];
      if (tc) { var box = tc.sub || (tc.sub = tc.card.appendChild(el('div', 'sub-agent'))); box.appendChild(node); scrollDown(); return; }
    }
    log.appendChild(node); scrollDown();
  }

  function md(src) {
    // Small markdown: code fences, inline code, bold, italics, links, headings, lists, tables, paragraphs.
    var out = [], lines = String(src).split('\n'), i = 0;
    function inline(s) {
      s = esc(s);
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
      s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>');
      s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      return s;
    }
    while (i < lines.length) {
      var l = lines[i];
      if (/^```/.test(l)) {
        var code = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
        i++; out.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>'); continue;
      }
      if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
        var rows = [];
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
        var cells = function (r) { return r.trim().replace(/^\||\|$/g, '').split('|'); };
        var h = '<table><tr>' + cells(rows[0]).map(function (c) { return '<th>' + inline(c.trim()) + '</th>'; }).join('') + '</tr>';
        rows.slice(2).forEach(function (r) { h += '<tr>' + cells(r).map(function (c) { return '<td>' + inline(c.trim()) + '</td>'; }).join('') + '</tr>'; });
        out.push(h + '</table>'); continue;
      }
      var hm = /^(#{1,6})\s+(.*)$/.exec(l);
      if (hm) { out.push('<h' + (hm[1].length < 3 ? 3 : 4) + '>' + inline(hm[2]) + '</h' + (hm[1].length < 3 ? 3 : 4) + '>'); i++; continue; }
      if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
        var ordered = /^\s*\d+\./.test(l), items = [];
        while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ''));
        out.push((ordered ? '<ol>' : '<ul>') + items.map(function (x) { return '<li>' + inline(x) + '</li>'; }).join('') + (ordered ? '</ol>' : '</ul>'));
        continue;
      }
      if (!l.trim()) { i++; continue; }
      var para = [];
      while (i < lines.length && lines[i].trim() && !/^```|^#{1,6}\s|^\s*([-*]|\d+\.)\s+|^\s*\|/.test(lines[i])) para.push(inline(lines[i++]));
      if (!para.length) para.push(inline(lines[i++]));
      out.push('<p>' + para.join('<br>') + '</p>');
    }
    return out.join('');
  }

  function toolParts(name) {
    var m = /^mcp__([^_]+(?:-[^_]+)*)__(.+)$/.exec(name);
    return m ? { srv: m[1], name: m[2] } : { srv: '', name: name };
  }
  function toolSummary(name, input) {
    input = input || {};
    if (input.reason) return input.reason;
    if (input.description) return input.description;
    if (input.command) return input.command;
    if (input.file_path) return input.file_path.split(/[\\/]/).pop();
    if (input.pattern) return input.pattern;
    if (input.url) return input.url;
    var k = Object.keys(input)[0];
    return k ? k + ': ' + JSON.stringify(input[k]).slice(0, 80) : '';
  }
  function toolCard(id, name, parent) {
    if (tools[id]) return tools[id];
    var tp = toolParts(name);
    var card = el('details', 'tool running');
    var sm = el('summary');
    sm.innerHTML = '<span class="st"></span><span class="name">' + esc(tp.name) + '</span>' + (tp.srv ? '<span class="srv">' + esc(tp.srv) + '</span>' : '') + '<span class="sum"></span>';
    card.appendChild(sm);
    var body = el('div', 'bodyx');
    var inp = el('pre'); body.appendChild(inp);
    card.appendChild(body);
    var t = { card: card, name: name, inputEl: inp, sumEl: sm.querySelector('.sum'), body: body, input: null };
    tools[id] = t;
    state.running[id] = { name: tp.name, summary: '' };
    addToLog(card, parent);
    return t;
  }
  function setToolInput(t, input) {
    t.input = input;
    t.inputEl.textContent = JSON.stringify(input, null, 2);
    t.sumEl.textContent = toolSummary(t.name, input);
    var id = Object.keys(tools).find(function (k) { return tools[k] === t; });
    if (state.running[id]) { state.running[id].summary = t.sumEl.textContent; state.running[id].input = input; }
    // A plan: update_plan of the OpenPnP MCP server (steps), or TodoWrite where Claude Code has it (todos).
    var plan = input && (/__update_plan$/.test(t.name) ? input.steps : t.name === 'TodoWrite' ? input.todos : null);
    if (Array.isArray(plan)) {
      state.todos = plan;
      var tc = t.todo || (t.todo = el('div', 'todo-card'));
      tc.innerHTML = plan.map(function (x) { return '<div class="' + esc(x.status) + '">' + (x.status === 'completed' ? '☑ ' : x.status === 'in_progress' ? '▶ ' : '☐ ') + esc(x.content) + '</div>'; }).join('');
      if (!tc.parentNode) t.card.parentNode.insertBefore(tc, t.card.nextSibling);
      t.card.hidden = true;
    }
    renderTimeline();
  }
  function toolResult(id, content, isError) {
    var t = tools[id];
    delete state.running[id];
    if (!t) return;
    t.card.classList.remove('running');
    t.card.classList.add(isError ? 'err' : 'ok');
    var texts = [], imgs = [];
    (Array.isArray(content) ? content : [{ type: 'text', text: content }]).forEach(function (c) {
      if (!c) return;
      if (c.type === 'text') texts.push(c.text);
      else if (c.type === 'image' && c.source && c.source.data) imgs.push('data:' + (c.source.media_type || 'image/png') + ';base64,' + c.source.data);
    });
    var pre = el('pre'); pre.textContent = texts.join('\n').slice(0, 20000);
    if (texts.length) t.body.appendChild(pre);
    if (imgs.length) {
      // Show images outside the folded card too, they are what the user wants to see.
      var row = el('div', 'tool-imgs');
      imgs.forEach(function (src) { var im = el('img'); im.src = src; im.alt = 'Image from the tool'; row.appendChild(im); });
      t.card.parentNode.insertBefore(row, t.card.nextSibling);
    }
    if (isError && texts.length) t.sumEl.textContent = texts.join(' ').slice(0, 160);
    renderTimeline();
    scrollDown();
  }

  function blockKey(msgId, index) { return msgId + ':' + index; }
  function startBlock(msgId, index, cb, parent) {
    var key = blockKey(msgId, index);
    if (blocks[key]) return blocks[key];
    var b = { type: cb.type, text: '', json: '' };
    if (cb.type === 'text') { b.el = el('div', 'msg-text'); addToLog(b.el, parent); }
    else if (cb.type === 'thinking') {
      b.el = el('details', 'think'); b.el.innerHTML = '<summary>Thinking</summary><div></div>'; addToLog(b.el, parent);
    }
    else if (cb.type === 'tool_use') { b.tool = toolCard(cb.id, cb.name, parent); b.id = cb.id; }
    blocks[key] = b;
    return b;
  }
  var renderQueued = {};
  function renderTextSoon(b) {
    if (b.queued) return;
    b.queued = true;
    requestAnimationFrame(function () { b.queued = false; b.el.innerHTML = md(b.text); scrollDown(); });
  }
  function onStream(ev, parent) {
    var e = ev.event, pk = parent || '';
    if (e.type === 'message_start') { currentMsg[pk] = e.message.id; streamed[e.message.id] = true; return; }
    var msgId = currentMsg[pk];
    if (!msgId) return;
    if (e.type === 'content_block_start') { startBlock(msgId, e.index, e.content_block, parent); return; }
    var b = blocks[blockKey(msgId, e.index)];
    if (!b) return;
    if (e.type === 'content_block_delta') {
      var d = e.delta;
      if (d.type === 'text_delta') { b.text += d.text; renderTextSoon(b); }
      else if (d.type === 'thinking_delta') { b.text += d.thinking; b.el.lastChild.textContent = b.text; }
      else if (d.type === 'input_json_delta') { b.json += d.partial_json; }
    } else if (e.type === 'content_block_stop' && b.type === 'tool_use' && b.json) {
      try { setToolInput(b.tool, JSON.parse(b.json)); } catch (x) {}
    }
  }
  function onAssistant(ev) {
    var m = ev.message, parent = ev.parent_tool_use_id;
    (m.content || []).forEach(function (c, i) {
      if (c.type === 'tool_use') {
        var t = toolCard(c.id, c.name, parent);
        setToolInput(t, c.input);
      } else if (!streamed[m.id]) {
        // No stream events for this message (e.g. a sub-agent): render it whole.
        var b = startBlock(m.id + '#full', blockCount(m.id), c, parent);
        if (c.type === 'text') { b.text = c.text; b.el.innerHTML = md(c.text); }
        else if (c.type === 'thinking' && c.thinking) { b.el.lastChild.textContent = c.thinking; }
      } else if (c.type === 'text') {
        // Make sure the streamed text ends exactly as the final message says.
        var sb = findStreamedText(m.id, c.text);
        if (sb && sb.text !== c.text) { sb.text = c.text; sb.el.innerHTML = md(c.text); }
      }
    });
    scrollDown();
  }
  var fullCounts = {};
  function blockCount(id) { fullCounts[id] = (fullCounts[id] || 0) + 1; return fullCounts[id]; }
  function findStreamedText(msgId, text) {
    var best = null;
    Object.keys(blocks).forEach(function (k) {
      if (k.indexOf(msgId + ':') === 0 && blocks[k].type === 'text' && text.indexOf(blocks[k].text.slice(0, 20)) === 0) best = blocks[k];
    });
    return best;
  }
  function onUser(ev) {
    var content = ev.message && ev.message.content;
    if (!Array.isArray(content)) return;
    content.forEach(function (c) {
      if (c.type === 'tool_result') toolResult(c.tool_use_id, c.content, c.is_error);
    });
  }
  function permCard(ev) {
    var card = el('div', 'perm');
    var tp = toolParts(ev.tool_name || '');
    card.appendChild(el('div', 'q', 'Allow Claude to use ' + tp.name + (tp.srv ? ' (' + tp.srv + ')' : '') + '?'));
    var sum = toolSummary(ev.tool_name, ev.input);
    if (sum) card.appendChild(el('div', null, sum));
    var pre = el('pre'); pre.textContent = JSON.stringify(ev.input, null, 2); card.appendChild(pre);
    var row = el('div', 'row');
    var yes = el('button', 'btn human', 'Allow'), no = el('button', 'btn danger', 'Deny');
    yes.type = no.type = 'button';
    yes.onclick = function () { answerPerm(ev.request_id, true); };
    no.onclick = function () { answerPerm(ev.request_id, false); };
    row.appendChild(yes); row.appendChild(no); card.appendChild(row);
    perms[ev.request_id] = card;
    addToLog(card);
  }
  function answerPerm(id, allow) {
    postJSON('/api/chat/permission', { request_id: id, allow: allow }).then(function (r) {
      if (r.status !== 'ok') markPerm(id, null, r.error);
    });
  }
  function markPerm(id, allow, note) {
    var card = perms[id];
    if (!card) return;
    card.classList.add('answered');
    card.appendChild(el('div', 'note', note || (allow ? 'Allowed' : 'Denied')));
  }
  function addUser(text, images) {
    var d = el('div', 'msg-user', text);
    (images || []).forEach(function (im) { var i = el('img'); i.src = 'data:' + im.media_type + ';base64,' + im.data; i.alt = 'Attached image'; d.appendChild(i); });
    stick = true;
    addToLog(d);
  }
  function clearChat() {
    log.querySelectorAll(':scope > :not(#chatEmpty)').forEach(function (n) { n.remove(); });
    $('chatEmpty').hidden = false;
    blocks = {}; streamed = {}; tools = {}; perms = {}; currentMsg = {}; state.todos = null; state.running = {};
    renderTimeline();
  }
  function onEvent(ev) {
    switch (ev.type) {
      case 'stream_event': onStream(ev, ev.parent_tool_use_id); break;
      case 'assistant': onAssistant(ev); break;
      case 'user': onUser(ev); break;
      case 'result':
        setBusy(false);
        state.running = {};
        log.appendChild(el('div', 'turn-end', (ev.is_error ? 'Error · ' : 'Done · ') + ((ev.duration_ms || 0) / 1000).toFixed(1) + ' s' + (ev.num_turns ? ' · ' + ev.num_turns + (ev.num_turns === 1 ? ' turn' : ' turns') : '')));
        renderTimeline(); scrollDown();
        break;
      case 'system':
        if (ev.subtype === 'init') $('chatSub').textContent = (ev.model || '').replace(/^claude-/, '');
        break;
      case 'ui':
        if (ev.subtype === 'user_text') { addUser(ev.text, ev.images); setBusy(true); }
        // update_plan is always approved by the server; no card for it.
        else if (ev.subtype === 'permission') { if (!(ev.request_id in perms) && !/__update_plan$/.test(ev.tool_name || '')) permCard(ev); }
        else if (ev.subtype === 'permission_answer') markPerm(ev.request_id, ev.allow, ev.auto ? 'Auto-approved' : null);
        else if (ev.subtype === 'reset') clearChat();
        else if (ev.subtype === 'exited') { setBusy(false); addToLog(el('div', 'note', 'Claude stopped. Your next message continues the same conversation.')); }
        else if (ev.subtype === 'stderr' && /error/i.test(ev.text)) addToLog(el('div', 'note err', ev.text.slice(0, 400)));
        break;
    }
  }
  function connect() {
    if (es) es.close();
    es = new EventSource('/api/chat/events?after=' + lastEvent);
    es.onmessage = function (m) {
      lastEvent = Number(m.lastEventId) || lastEvent;
      try { onEvent(JSON.parse(m.data)); } catch (x) { console.error(x); }
    };
    es.onerror = function () { es.close(); setTimeout(connect, 2000); };
  }
  function setBusy(b) {
    $('stop').hidden = !b;
    $('send').textContent = b ? 'Add' : 'Send';
  }

  var attachments = [];
  function renderAttach() {
    var a = $('attach'); a.innerHTML = '';
    attachments.forEach(function (im, i) {
      var img = el('img'); img.src = 'data:' + im.media_type + ';base64,' + im.data; img.alt = 'Image to attach'; img.title = 'Click to remove';
      img.onclick = function () { attachments.splice(i, 1); renderAttach(); };
      a.appendChild(img);
    });
  }
  $('attachCam').onclick = function () {
    var name = camMode === '__both' || !camMode ? (cams[0] || {}).name : camMode;
    if (!name) return;
    fetch('/api/view/camera/frame?camera=' + encodeURIComponent(name), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(); return r.blob(); })
      .then(function (blob) {
        var fr = new FileReader();
        fr.onload = function () { attachments.push({ media_type: 'image/jpeg', data: String(fr.result).split(',')[1] }); renderAttach(); };
        fr.readAsDataURL(blob);
      })
      .catch(function () { addToLog(el('div', 'note err', 'Could not get a camera image.')); });
  };
  function send() {
    var t = $('input'), text = t.value.trim();
    if (!text) return;
    var imgs = attachments.slice();
    t.value = ''; attachments = []; renderAttach();
    postJSON('/api/chat/send', { text: text, images: imgs }).then(function (r) {
      if (r.status !== 'ok') addToLog(el('div', 'note err', r.error || 'Could not send'));
    });
  }
  $('send').onclick = send;
  $('input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  $('stop').onclick = function () { postJSON('/api/chat/interrupt'); };
  $('newChat').onclick = function () { postJSON('/api/chat/reset'); };
  $('autoApprove').onchange = function () {
    postJSON('/api/chat/settings', { autoApprove: this.checked });
    $('autoWrap').classList.toggle('on', this.checked);
  };
  log.addEventListener('click', function (e) {
    if (e.target.tagName === 'IMG') { $('lightbox').querySelector('img').src = e.target.src; $('lightbox').style.display = 'grid'; }
  });
  $('lightbox').onclick = function () { this.style.display = 'none'; };

  // ------------------------------------------------------------------ start
  getJSON('/api/chat/state').then(function (s) {
    state.sim = s.sim;
    $('autoApprove').checked = s.autoApprove;
    $('autoWrap').classList.toggle('on', s.autoApprove);
    setBusy(s.busy);
  }).finally(function () {
    connect();
    pollStatus(); setInterval(pollStatus, 1000);
    loadCameras();
    pollLayout(); setInterval(pollLayout, 4000);
    pollActions(); setInterval(pollActions, 3000);
  });
})();
</script>
</body>
</html>

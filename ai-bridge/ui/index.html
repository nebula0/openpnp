<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LumenPnP 副駕</title>
<style>
/* Layout: one screen, three columns. Left: camera over board. Middle: task timeline over the
   collapsible parts list. Right: the Claude chat. Amber = a person decides, teal = the machine or
   Claude did it. Single dark look for a machine room screen. */
:root {
  color-scheme: dark;
  --bg: #0d1216;
  --panel: #131a1f;
  --panel-2: #182128;
  --line: #24303a;
  --fg: #e4eaee;
  --muted: #8494a0;
  --faint: #4e5c67;
  --ai: #5ec4bd;
  --ai-dim: #1d3a3a;
  --human: #f0b25c;
  --human-dim: #3a2c17;
  --pass: #7fd394;
  --fail: #ef7468;
  --warn: #e8c35a;
  --font-ui: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", "Heiti TC", sans-serif;
  --font-num: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-ui); overflow: hidden; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
.mono { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

#app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
header {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 14px;
  border-bottom: 1px solid var(--line); background: var(--panel);
}
header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 700; letter-spacing: .02em; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px;
  border: 1px solid var(--line); font-size: 12px; color: var(--muted); white-space: nowrap;
}
.chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.chip.on i { background: var(--pass); }
.chip.bad { color: var(--fail); border-color: #4a2a28; }
.chip.bad i { background: var(--fail); }
.chip.busy i { background: var(--warn); animation: blink 1s infinite; }
.chip.sim { color: var(--warn); border-color: #4a4020; }
.chip.real { color: var(--human); border-color: var(--human-dim); }
.chip.part { color: var(--ai); border-color: var(--ai-dim); }
header .spacer { flex: 1; }
header .job { color: var(--muted); font-size: 12px; max-width: 40ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@keyframes blink { 50% { opacity: .3; } }

main {
  min-height: 0; display: grid; gap: 10px; padding: 10px;
  grid-template-columns: minmax(420px, 1.25fr) minmax(300px, .8fr) minmax(360px, 1fr);
}
.col { min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-height: 0; display: flex; flex-direction: column; }
.ph { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--line); }
.ph h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .03em; }
.ph .sub { color: var(--muted); font-size: 12px; }
.ph .grow { flex: 1; }
.tabs { display: flex; gap: 2px; background: var(--bg); border-radius: 7px; padding: 2px; }
.tabs button { border: 0; background: none; padding: 2px 9px; border-radius: 5px; cursor: pointer; font-size: 12px; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--panel-2); color: var(--fg); }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--ai-dim); border-color: var(--ai); color: var(--fg); }
.btn.human { background: var(--human-dim); border-color: var(--human); }
.btn.danger { border-color: #5a2c29; color: var(--fail); }
.btn:disabled { opacity: .4; cursor: default; }

/* camera */
#cameraPanel { flex: 0 0 auto; }
.cams { display: grid; gap: 6px; padding: 6px; grid-template-columns: 1fr; justify-items: center; }
.cams .cam { width: 100%; }
.cams.both { grid-template-columns: 1fr 1fr; }
.cam { position: relative; background: #000; border-radius: 6px; overflow: hidden; aspect-ratio: 4 / 3; max-height: 38vh; }
.cams.both .cam { max-height: 26vh; }
.cam img { width: 100%; height: 100%; object-fit: contain; display: block; }
.cam .label { position: absolute; left: 8px; top: 6px; font-size: 11px; color: #fff; background: rgba(0,0,0,.55); padding: 1px 7px; border-radius: 4px; }
.cam .cross { position: absolute; inset: 0; pointer-events: none; }
.cam .cross::before, .cam .cross::after { content: ""; position: absolute; background: rgba(94,196,189,.45); }
.cam .cross::before { left: 50%; top: 0; bottom: 0; width: 1px; }
.cam .cross::after { top: 50%; left: 0; right: 0; height: 1px; }
.cam .msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; color: var(--muted); font-size: 13px; }

/* board */
#boardPanel { flex: 1 1 auto; }
#boardWrap { position: relative; flex: 1; min-height: 160px; }
#board { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
#board.dragging { cursor: grabbing; }
#board .pl { cursor: pointer; }
#board .pad { fill: #3a4650; }
#board .pl.placed .pad { fill: var(--ai); }
#board .pl.todo .pad { fill: #55626c; }
#board .pl.disabled { opacity: .3; }
#board .pl.sel .pad { fill: var(--human); }
#board .pl.now .pad { fill: var(--human); animation: blink 1s infinite; }
#board .body { fill: none; stroke: #6b7a85; stroke-width: .06; stroke-dasharray: .25 .18; }
#board .pl.sel .body { stroke: var(--human); stroke-width: .12; stroke-dasharray: none; }
#board .lbl { font: .7px var(--font-num); fill: #9fb2bb; text-anchor: middle; pointer-events: none; }
#board .fid { fill: none; stroke: var(--warn); stroke-width: .12; }
#boardTip {
  position: absolute; pointer-events: none; background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 8px; font-size: 12px; white-space: nowrap; display: none; z-index: 5;
}
.legend { display: flex; gap: 10px; font-size: 11px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; background: var(--c); }

/* timeline */
#taskPanel { flex: 1 1 60%; }
#lyrics {
  position: relative; flex: 1; min-height: 0; overflow-y: auto; padding: 40% 14px; margin: 0; list-style: none; scroll-behavior: smooth;
  -webkit-mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent);
          mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent);
}
#lyrics.all { padding: 10px 14px; -webkit-mask-image: none; mask-image: none; }
#lyrics li { padding: 5px 0 5px 22px; position: relative; transition: opacity .3s, font-size .3s, color .3s; color: var(--muted); font-size: 14px; line-height: 1.35; }
#lyrics li::before { content: ""; position: absolute; left: 4px; top: .75em; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--faint); }
#lyrics li.done::before { background: var(--ai); border-color: var(--ai); }
#lyrics li.fail::before { background: var(--fail); border-color: var(--fail); }
#lyrics li.future::before { border-style: dashed; }
#lyrics li.current { color: var(--fg); font-size: 19px; font-weight: 700; padding-block: 10px; }
#lyrics li.current::before { width: 11px; height: 11px; left: 2px; top: 1.05em; background: var(--human); border-color: var(--human); box-shadow: 0 0 0 4px rgba(240,178,92,.2); }
#lyrics li.idle { color: var(--faint); font-size: 14px; font-weight: 400; font-style: italic; }
#lyrics li.idle::before { background: none; border-color: var(--faint); box-shadow: none; }
#lyrics li .meta { display: block; font-size: 11px; color: var(--faint); font-weight: 400; font-family: var(--font-num); }
#lyrics li.fail .meta { color: var(--fail); }
#lyrics li.current .meta { color: var(--human); font-size: 12px; }
#lyrics:not(.all) li[data-d="1"] { opacity: .85; }
#lyrics:not(.all) li[data-d="2"] { opacity: .65; }
#lyrics:not(.all) li[data-d="3"] { opacity: .45; }
#lyrics:not(.all) li[data-d="far"] { opacity: .3; }

/* parts */
#partsPanel { flex: 0 1 auto; max-height: 45%; }
#partsPanel.open { flex: 1 1 40%; }
#partsPanel .ph { cursor: pointer; user-select: none; }
#partsPanel:not(.open) .ph { border-bottom: 0; }
#partsPanel .caret { transition: transform .2s; color: var(--muted); }
#partsPanel.open .caret { transform: rotate(90deg); }
#partsBody { display: none; flex-direction: column; min-height: 0; flex: 1; }
#partsPanel.open #partsBody { display: flex; }
#partsFilter { margin: 8px 10px 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; color: var(--fg); font: inherit; font-size: 13px; }
#parts { overflow-y: auto; padding: 0 6px 8px; flex: 1; }
.part { border-radius: 6px; }
.part > summary { list-style: none; display: grid; grid-template-columns: 12px 1fr auto; gap: 6px; align-items: center; padding: 5px 6px; cursor: pointer; border-radius: 6px; }
.part > summary::-webkit-details-marker { display: none; }
.part > summary:hover { background: var(--panel-2); }
.part.sel > summary { background: var(--human-dim); }
.part > summary::before { content: "▸"; color: var(--faint); font-size: 10px; }
.part[open] > summary::before { content: "▾"; }
.part .pid { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.part .pkg { color: var(--faint); font-size: 11px; margin-left: 6px; }
.part .count { font-size: 12px; color: var(--muted); }
.part .count.full { color: var(--ai); }
.part ul { list-style: none; margin: 0 0 4px 24px; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; }
.part li button { border: 1px solid var(--line); background: var(--bg); border-radius: 4px; padding: 0 6px; font: 12px var(--font-num); cursor: pointer; color: var(--muted); }
.part li button.placed { color: var(--ai); border-color: var(--ai-dim); }
.part li button.sel { color: var(--human); border-color: var(--human); }

/* chat */
#chatPanel { flex: 1; }
#chatLog { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.empty { color: var(--faint); text-align: center; margin: auto; max-width: 30ch; }
.msg-user { align-self: flex-end; max-width: 88%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px 10px 2px 10px; padding: 7px 11px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg-user img { display: block; max-width: 160px; border-radius: 4px; margin-top: 6px; }
.msg-text { overflow-wrap: anywhere; }
.msg-text p { margin: 0 0 .55em; }
.msg-text p:last-child { margin-bottom: 0; }
.msg-text ul, .msg-text ol { margin: .2em 0 .6em; padding-left: 1.4em; }
.msg-text code { font: 12.5px var(--font-num); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.msg-text pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; overflow-x: auto; margin: .3em 0 .7em; }
.msg-text pre code { border: 0; padding: 0; background: none; }
.msg-text h3, .msg-text h4 { margin: .6em 0 .3em; font-size: 14px; }
.msg-text table { border-collapse: collapse; margin: .3em 0 .7em; font-size: 13px; display: block; overflow-x: auto; }
.msg-text th, .msg-text td { border: 1px solid var(--line); padding: 2px 7px; text-align: left; }
.msg-text a { color: var(--ai); }
.sub-agent { margin-left: 14px; padding-left: 10px; border-left: 2px solid var(--line); }
details.think { color: var(--faint); font-size: 12.5px; }
details.think summary { cursor: pointer; }
details.think div { white-space: pre-wrap; padding: 4px 0 0 12px; }
.tool { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 12.5px; }
.tool > summary { list-style: none; display: flex; gap: 8px; align-items: center; padding: 5px 9px; cursor: pointer; }
.tool > summary::-webkit-details-marker { display: none; }
.tool .st { width: 14px; text-align: center; flex: 0 0 auto; }
.tool.running .st::before { content: "◌"; color: var(--warn); display: inline-block; animation: spin 1s linear infinite; }
.tool.ok .st::before { content: "✓"; color: var(--pass); }
.tool.err .st::before { content: "✗"; color: var(--fail); }
.tool .name { font-family: var(--font-num); color: var(--fg); white-space: nowrap; }
.tool .srv { color: var(--faint); font-family: var(--font-num); }
.tool .sum { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.tool .bodyx { border-top: 1px solid var(--line); padding: 6px 9px; display: flex; flex-direction: column; gap: 6px; }
.tool pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 11.5px/1.45 var(--font-num); color: var(--muted); max-height: 260px; overflow-y: auto; }
.tool .imgs { display: flex; flex-wrap: wrap; gap: 6px; }
.tool .imgs img, .tool-imgs img { height: 96px; border-radius: 4px; cursor: zoom-in; border: 1px solid var(--line); }
.tool-imgs { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 0 22px; }
@keyframes spin { to { transform: rotate(360deg); } }
.todo-card { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
.todo-card div { padding: 1px 0; }
.todo-card .completed { color: var(--faint); text-decoration: line-through; }
.todo-card .in_progress { color: var(--human); font-weight: 700; }
.perm { border: 1px solid var(--human); background: var(--human-dim); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.perm .q { font-weight: 700; }
.perm pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 11.5px var(--font-num); color: var(--muted); max-height: 160px; overflow-y: auto; }
.perm .row { display: flex; gap: 8px; }
.perm.answered { border-color: var(--line); background: none; }
.perm.answered .row { display: none; }
.note { color: var(--faint); font-size: 12px; text-align: center; }
.note.err { color: var(--fail); }
.turn-end { color: var(--faint); font-size: 11px; font-family: var(--font-num); }
#composer { border-top: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; gap: 6px; }
#composer textarea {
  resize: none; min-height: 58px; max-height: 200px; background: var(--bg); color: var(--fg); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 10px; font: inherit;
}
#composer .row { display: flex; gap: 6px; align-items: center; }
#composer .row .grow { flex: 1; }
#attach { display: flex; gap: 6px; }
#attach img { height: 44px; border-radius: 4px; border: 1px solid var(--line); }
.switch { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }
.switch input { accent-color: var(--human); }
.switch.on { color: var(--human); }

#lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; place-items: center; z-index: 20; cursor: zoom-out; }
#lightbox img { max-width: 94vw; max-height: 94vh; }

@media (max-width: 1180px) {
  body { overflow: auto; }
  #app { height: auto; }
  main { grid-template-columns: 1fr; }
  #boardWrap { min-height: 320px; }
  #taskPanel { min-height: 340px; }
  #chatPanel { min-height: 520px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>LumenPnP 副駕</h1>
    <span class="chip" id="cMachine">連線中…</span>
    <span class="chip" id="cEnabled"><i></i>啟用</span>
    <span class="chip" id="cHomed"><i></i>歸零</span>
    <span class="chip" id="cBusy"><i></i>待命</span>
    <span id="cNozzles" style="display:contents"></span>
    <span class="spacer"></span>
    <span class="job mono" id="jobName"></span>
  </header>
  <main>
    <section class="col">
      <div class="panel" id="cameraPanel">
        <div class="ph">
          <h2>相機</h2>
          <div class="tabs" id="camTabs" role="group" aria-label="相機"></div>
          <span class="grow"></span>
          <button class="btn" id="camPause" type="button">暫停</button>
        </div>
        <div class="cams" id="cams"></div>
      </div>
      <div class="panel" id="boardPanel">
        <div class="ph">
          <h2>電路板</h2>
          <div class="tabs" id="boardTabs" role="group" aria-label="板子"></div>
          <span class="grow"></span>
          <div class="legend"><span style="--c:var(--ai)">已放</span><span style="--c:#55626c">未放</span><span style="--c:var(--human)">選取</span></div>
          <button class="btn" id="boardFit" type="button" title="重設縮放">⤢</button>
        </div>
        <div id="boardWrap">
          <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
          <div id="boardTip"></div>
        </div>
      </div>
    </section>

    <section class="col">
      <div class="panel" id="taskPanel">
        <div class="ph">
          <h2>Task</h2>
          <span class="sub" id="taskSub"></span>
          <span class="grow"></span>
          <button class="btn" id="lyricsMode" type="button">展開全部</button>
        </div>
        <ol id="lyrics"></ol>
      </div>
      <div class="panel" id="partsPanel">
        <div class="ph" id="partsHead" role="button" tabindex="0" aria-expanded="false">
          <span class="caret">▸</span>
          <h2>元件</h2>
          <span class="sub" id="partsSub"></span>
        </div>
        <div id="partsBody">
          <input id="partsFilter" type="search" placeholder="篩選零件或位號">
          <div id="parts"></div>
        </div>
      </div>
    </section>

    <section class="col">
      <div class="panel" id="chatPanel">
        <div class="ph">
          <h2>Claude</h2>
          <span class="sub" id="chatSub"></span>
          <span class="grow"></span>
          <label class="switch" id="autoWrap" title="開啟後，需要權限的工具不再詢問，直接執行"><input type="checkbox" id="autoApprove">自動核准</label>
          <button class="btn" id="newChat" type="button">新對話</button>
        </div>
        <div id="chatLog"><div class="empty" id="chatEmpty">跟 Claude 說要做什麼。需要權限的工具會在這裡請你核准。</div></div>
        <div id="composer">
          <div id="attach"></div>
          <textarea id="input" placeholder="例如：掃 QR 認 feeder，然後放 Brd2 的 0603（Enter 送出，Shift+Enter 換行）"></textarea>
          <div class="row">
            <button class="btn" id="attachCam" type="button">附上相機畫面</button>
            <span class="grow"></span>
            <button class="btn danger" id="stop" type="button" hidden>停止</button>
            <button class="btn primary" id="send" type="button">送出</button>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>
<div id="lightbox"><img alt=""></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var SVGNS = 'http://www.w3.org/2000/svg';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function svg(tag, attrs, parent) {
    var e = document.createElementNS(SVGNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function getJSON(url) {
    return fetch(url, { cache: 'no-store' }).then(function (r) {
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; });
    });
  }
  function postJSON(url, body) {
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) })
      .then(function (r) { return r.json(); });
  }
  function hhmm(t) {
    var d = new Date(t);
    return isNaN(d) ? '' : String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  var state = {
    status: null, layout: null, actions: [], todos: null, running: {}, board: null,
    selPart: null, selPlacement: null, sim: false
  };

  // ------------------------------------------------------------------ status header
  function chip(id, on, text, cls) {
    var c = $(id);
    c.className = 'chip' + (cls ? ' ' + cls : on ? ' on' : '');
    c.innerHTML = '<i></i>' + esc(text);
  }
  function pollStatus() {
    getJSON('/api/view/status').then(function (s) {
      state.status = s;
      $('cMachine').className = 'chip ' + (state.sim ? 'sim' : 'real');
      $('cMachine').textContent = state.sim ? '模擬機' : '真機';
      chip('cEnabled', s.enabled, s.enabled ? '已啟用' : '未啟用', s.enabled ? '' : 'bad');
      chip('cHomed', s.homed, s.homed ? '已歸零' : '未歸零', s.homed ? '' : 'bad');
      chip('cBusy', false, s.jobActive ? 'Job 執行中' : s.busy ? '機器動作中' : '待命', s.busy || s.jobActive ? 'busy' : '');
      var nz = $('cNozzles'); nz.innerHTML = '';
      (s.nozzles || []).forEach(function (n) {

        var cells = function (r) { return r.trim().replace(/^\||\|$/g, '').split('|'); };
        var h = '<table><tr>' + cells(rows[0]).map(function (c) { return '<th>' + inline(c.trim()) + '</th>'; }).join('') + '</tr>';
        rows.slice(2).forEach(function (r) { h += '<tr>' + cells(r).map(function (c) { return '<td>' + inline(c.trim()) + '</td>'; }).join('') + '</tr>'; });
        out.push(h + '</table>'); continue;
      }
      var hm = /^(#{1,6})\s+(.*)$/.exec(l);
      if (hm) { out.push('<h' + (hm[1].length < 3 ? 3 : 4) + '>' + inline(hm[2]) + '</h' + (hm[1].length < 3 ? 3 : 4) + '>'); i++; continue; }
      if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
        var ordered = /^\s*\d+\./.test(l), items = [];
        while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ''));
        out.push((ordered ? '<ol>' : '<ul>') + items.map(function (x) { return '<li>' + inline(x) + '</li>'; }).join('') + (ordered ? '</ol>' : '</ul>'));
        continue;
      }
      if (!l.trim()) { i++; continue; }
      var para = [];
      while (i < lines.length && lines[i].trim() && !/^```|^#{1,6}\s|^\s*([-*]|\d+\.)\s+|^\s*\|/.test(lines[i])) para.push(inline(lines[i++]));
      if (!para.length) para.push(inline(lines[i++]));
      out.push('<p>' + para.join('<br>') + '</p>');
    }
    return out.join('');
  }

  function toolParts(name) {
    var m = /^mcp__([^_]+(?:-[^_]+)*)__(.+)$/.exec(name);
    return m ? { srv: m[1], name: m[2] } : { srv: '', name: name };
  }
  function toolSummary(name, input) {
    input = input || {};
    if (input.reason) return input.reason;
    if (input.description) return input.description;
    if (input.command) return input.command;
    if (input.file_path) return input.file_path.split(/[\\/]/).pop();
    if (input.pattern) return input.pattern;
    if (input.url) return input.url;
    var k = Object.keys(input)[0];
    return k ? k + ': ' + JSON.stringify(input[k]).slice(0, 80) : '';
  }
  function toolCard(id, name, parent) {
    if (tools[id]) return tools[id];
    var tp = toolParts(name);
    var card = el('details', 'tool running');
    var sm = el('summary');
    sm.innerHTML = '<span class="st"></span><span class="name">' + esc(tp.name) + '</span>' + (tp.srv ? '<span class="srv">' + esc(tp.srv) + '</span>' : '') + '<span class="sum"></span>';
    card.appendChild(sm);
    var body = el('div', 'bodyx');
    var inp = el('pre'); body.appendChild(inp);
    card.appendChild(body);
    var t = { card: card, name: name, inputEl: inp, sumEl: sm.querySelector('.sum'), body: body, input: null };
    tools[id] = t;
    state.running[id] = { name: tp.name, summary: '' };
    addToLog(card, parent);
    return t;
  }
  function setToolInput(t, input) {
    t.input = input;
    t.inputEl.textContent = JSON.stringify(input, null, 2);
    t.sumEl.textContent = toolSummary(t.name, input);
    var id = Object.keys(tools).find(function (k) { return tools[k] === t; });
    if (state.running[id]) state.running[id].summary = t.sumEl.textContent;
    if (t.name === 'TodoWrite' && input && input.todos) {
      state.todos = input.todos;
      var tc = t.todo || (t.todo = el('div', 'todo-card'));
      tc.innerHTML = input.todos.map(function (x) { return '<div class="' + esc(x.status) + '">' + (x.status === 'completed' ? '☑ ' : x.status === 'in_progress' ? '▶ ' : '☐ ') + esc(x.content) + '</div>'; }).join('');
      if (!tc.parentNode) t.card.parentNode.insertBefore(tc, t.card.nextSibling);
      t.card.hidden = true;
    }
    renderTimeline();
  }
  function toolResult(id, content, isError) {
    var t = tools[id];
    delete state.running[id];
    if (!t) return;
    t.card.classList.remove('running');
    t.card.classList.add(isError ? 'err' : 'ok');
    var texts = [], imgs = [];
    (Array.isArray(content) ? content : [{ type: 'text', text: content }]).forEach(function (c) {
      if (!c) return;
      if (c.type === 'text') texts.push(c.text);
      else if (c.type === 'image' && c.source && c.source.data) imgs.push('data:' + (c.source.media_type || 'image/png') + ';base64,' + c.source.data);
    });
    var pre = el('pre'); pre.textContent = texts.join('\n').slice(0, 20000);
    if (texts.length) t.body.appendChild(pre);
    if (imgs.length) {
      // Show images outside the folded card too, they are what the user wants to see.
      var row = el('div', 'tool-imgs');
      imgs.forEach(function (src) { var im = el('img'); im.src = src; im.alt = '工具回傳的圖片'; row.appendChild(im); });
      t.card.parentNode.insertBefore(row, t.card.nextSibling);
    }
    if (isError && texts.length) t.sumEl.textContent = texts.join(' ').slice(0, 160);
    renderTimeline();
    scrollDown();
  }

  function blockKey(msgId, index) { return msgId + ':' + index; }
  function startBlock(msgId, index, cb, parent) {
    var key = blockKey(msgId, index);
    if (blocks[key]) return blocks[key];
    var b = { type: cb.type, text: '', json: '' };
    if (cb.type === 'text') { b.el = el('div', 'msg-text'); addToLog(b.el, parent); }
    else if (cb.type === 'thinking') {
      b.el = el('details', 'think'); b.el.innerHTML = '<summary>思考</summary><div></div>'; addToLog(b.el, parent);
    }
    else if (cb.type === 'tool_use') { b.tool = toolCard(cb.id, cb.name, parent); b.id = cb.id; }
    blocks[key] = b;
    return b;
  }
  var renderQueued = {};
  function renderTextSoon(b) {
    if (b.queued) return;
    b.queued = true;
    requestAnimationFrame(function () { b.queued = false; b.el.innerHTML = md(b.text); scrollDown(); });
  }
  function onStream(ev, parent) {
    var e = ev.event, pk = parent || '';
    if (e.type === 'message_start') { currentMsg[pk] = e.message.id; streamed[e.message.id] = true; return; }
    var msgId = currentMsg[pk];
    if (!msgId) return;
    if (e.type === 'content_block_start') { startBlock(msgId, e.index, e.content_block, parent); return; }
    var b = blocks[blockKey(msgId, e.index)];
    if (!b) return;
    if (e.type === 'content_block_delta') {
      var d = e.delta;
      if (d.type === 'text_delta') { b.text += d.text; renderTextSoon(b); }
      else if (d.type === 'thinking_delta') { b.text += d.thinking; b.el.lastChild.textContent = b.text; }
      else if (d.type === 'input_json_delta') { b.json += d.partial_json; }
    } else if (e.type === 'content_block_stop' && b.type === 'tool_use' && b.json) {
      try { setToolInput(b.tool, JSON.parse(b.json)); } catch (x) {}
    }
  }
  function onAssistant(ev) {
    var m = ev.message, parent = ev.parent_tool_use_id;
    (m.content || []).forEach(function (c, i) {
      if (c.type === 'tool_use') {
        var t = toolCard(c.id, c.name, parent);
        setToolInput(t, c.input);
      } else if (!streamed[m.id]) {
        // No stream events for this message (e.g. a sub-agent): render it whole.
        var b = startBlock(m.id + '#full', blockCount(m.id), c, parent);
        if (c.type === 'text') { b.text = c.text; b.el.innerHTML = md(c.text); }
        else if (c.type === 'thinking' && c.thinking) { b.el.lastChild.textContent = c.thinking; }
      } else if (c.type === 'text') {
        // Make sure the streamed text ends exactly as the final message says.
        var sb = findStreamedText(m.id, c.text);
        if (sb && sb.text !== c.text) { sb.text = c.text; sb.el.innerHTML = md(c.text); }
      }
    });
    scrollDown();
  }
  var fullCounts = {};
  function blockCount(id) { fullCounts[id] = (fullCounts[id] || 0) + 1; return fullCounts[id]; }
  function findStreamedText(msgId, text) {
    var best = null;
    Object.keys(blocks).forEach(function (k) {
      if (k.indexOf(msgId + ':') === 0 && blocks[k].type === 'text' && text.indexOf(blocks[k].text.slice(0, 20)) === 0) best = blocks[k];
    });
    return best;
  }
  function onUser(ev) {
    var content = ev.message && ev.message.content;
    if (!Array.isArray(content)) return;
    content.forEach(function (c) {
      if (c.type === 'tool_result') toolResult(c.tool_use_id, c.content, c.is_error);
    });
  }
  function permCard(ev) {
    var card = el('div', 'perm');
    var tp = toolParts(ev.tool_name || '');
    card.appendChild(el('div', 'q', '要讓 Claude 用「' + tp.name + '」嗎？' + (tp.srv ? '（' + tp.srv + '）' : '')));
    var sum = toolSummary(ev.tool_name, ev.input);
    if (sum) card.appendChild(el('div', null, sum));
    var pre = el('pre'); pre.textContent = JSON.stringify(ev.input, null, 2); card.appendChild(pre);
    var row = el('div', 'row');
    var yes = el('button', 'btn human', '核准'), no = el('button', 'btn danger', '拒絕');
    yes.type = no.type = 'button';
    yes.onclick = function () { answerPerm(ev.request_id, true); };
    no.onclick = function () { answerPerm(ev.request_id, false); };
    row.appendChild(yes); row.appendChild(no); card.appendChild(row);
    perms[ev.request_id] = card;
    addToLog(card);
  }
  function answerPerm(id, allow) {
    postJSON('/api/chat/permission', { request_id: id, allow: allow }).then(function (r) {
      if (r.status !== 'ok') markPerm(id, null, r.error);
    });
  }
  function markPerm(id, allow, note) {
    var card = perms[id];
    if (!card) return;
    card.classList.add('answered');
    card.appendChild(el('div', 'note', note || (allow ? '已核准' : '已拒絕')));
  }
  function addUser(text, images) {
    var d = el('div', 'msg-user', text);
    (images || []).forEach(function (im) { var i = el('img'); i.src = 'data:' + im.media_type + ';base64,' + im.data; i.alt = '附上的圖片'; d.appendChild(i); });
    stick = true;
    addToLog(d);
  }
  function clearChat() {
    log.querySelectorAll(':scope > :not(#chatEmpty)').forEach(function (n) { n.remove(); });
    $('chatEmpty').hidden = false;
    blocks = {}; streamed = {}; tools = {}; perms = {}; currentMsg = {}; state.todos = null; state.running = {};
    renderTimeline();
  }
  function onEvent(ev) {
    switch (ev.type) {
      case 'stream_event': onStream(ev, ev.parent_tool_use_id); break;
      case 'assistant': onAssistant(ev); break;
      case 'user': onUser(ev); break;
      case 'result':
        setBusy(false);
        state.running = {};
        log.appendChild(el('div', 'turn-end', (ev.is_error ? '出錯 · ' : '完成 · ') + ((ev.duration_ms || 0) / 1000).toFixed(1) + ' 秒' + (ev.num_turns ? ' · ' + ev.num_turns + ' 輪' : '')));
        renderTimeline(); scrollDown();
        break;
      case 'system':
        if (ev.subtype === 'init') $('chatSub').textContent = (ev.model || '').replace(/^claude-/, '');
        break;
      case 'ui':
        if (ev.subtype === 'user_text') { addUser(ev.text, ev.images); setBusy(true); }
        else if (ev.subtype === 'permission') { if (!(ev.request_id in perms)) permCard(ev); }
        else if (ev.subtype === 'permission_answer') markPerm(ev.request_id, ev.allow, ev.auto ? '自動核准' : null);
        else if (ev.subtype === 'reset') clearChat();
        else if (ev.subtype === 'exited') { setBusy(false); addToLog(el('div', 'note', 'Claude 已結束。下次送出訊息時會接續同一段對話。')); }
        else if (ev.subtype === 'stderr' && /error|Error|錯誤/.test(ev.text)) addToLog(el('div', 'note err', ev.text.slice(0, 400)));
        break;
    }
  }
  function connect() {
    if (es) es.close();
    es = new EventSource('/api/chat/events?after=' + lastEvent);
    es.onmessage = function (m) {
      lastEvent = Number(m.lastEventId) || lastEvent;
      try { onEvent(JSON.parse(m.data)); } catch (x) { console.error(x); }
    };
    es.onerror = function () { es.close(); setTimeout(connect, 2000); };
  }
  function setBusy(b) {
    $('stop').hidden = !b;
    $('send').textContent = b ? '追加' : '送出';
  }

  var attachments = [];
  function renderAttach() {
    var a = $('attach'); a.innerHTML = '';
    attachments.forEach(function (im, i) {
      var img = el('img'); img.src = 'data:' + im.media_type + ';base64,' + im.data; img.alt = '要附上的圖片'; img.title = '點一下移除';
      img.onclick = function () { attachments.splice(i, 1); renderAttach(); };
      a.appendChild(img);
    });
  }
  $('attachCam').onclick = function () {
    var name = camMode === '__both' || !camMode ? (cams[0] || {}).name : camMode;
    if (!name) return;
    fetch('/api/view/camera/frame?camera=' + encodeURIComponent(name), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(); return r.blob(); })
      .then(function (blob) {
        var fr = new FileReader();
        fr.onload = function () { attachments.push({ media_type: 'image/jpeg', data: String(fr.result).split(',')[1] }); renderAttach(); };
        fr.readAsDataURL(blob);
      })
      .catch(function () { addToLog(el('div', 'note err', '拿不到相機畫面。')); });
  };
  function send() {
    var t = $('input'), text = t.value.trim();
    if (!text) return;
    var imgs = attachments.slice();
    t.value = ''; attachments = []; renderAttach();
    postJSON('/api/chat/send', { text: text, images: imgs }).then(function (r) {
      if (r.status !== 'ok') addToLog(el('div', 'note err', r.error || '送不出去'));
    });
  }
  $('send').onclick = send;
  $('input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  $('stop').onclick = function () { postJSON('/api/chat/interrupt'); };
  $('newChat').onclick = function () { postJSON('/api/chat/reset'); };
  $('autoApprove').onchange = function () {
    postJSON('/api/chat/settings', { autoApprove: this.checked });
    $('autoWrap').classList.toggle('on', this.checked);
  };
  log.addEventListener('click', function (e) {
    if (e.target.tagName === 'IMG') { $('lightbox').querySelector('img').src = e.target.src; $('lightbox').style.display = 'grid'; }
  });
  $('lightbox').onclick = function () { this.style.display = 'none'; };

  // ------------------------------------------------------------------ start
  getJSON('/api/chat/state').then(function (s) {
    state.sim = s.sim;
    $('autoApprove').checked = s.autoApprove;
    $('autoWrap').classList.toggle('on', s.autoApprove);
    setBusy(s.busy);
  }).finally(function () {
    connect();
    pollStatus(); setInterval(pollStatus, 2000);
    loadCameras();
    pollLayout(); setInterval(pollLayout, 4000);
    pollActions(); setInterval(pollActions, 3000);
  });
})();
</script>
</body>
